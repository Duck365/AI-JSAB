<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Evasion</title>
    <link rel="stylesheet" href="style (1).css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1>VOID EVASION</h1>
                <p id="subtitle">The man who speaks in hands awaits...</p>
                <div class="controls-info">Move: WASD / Arrows | Dash: Space | Debug: `</div>
                
                <!-- NEW DEBUG BUTTON -->
                <button id="debug-btn" style="margin-bottom: 15px; font-size: 14px;">Debug Mode: OFF</button>
                
                <button id="start-btn">Enter The Void</button>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <h1>SHATTERED</h1>
                <p>Your determination wasn't enough.</p>
                <button id="restart-btn">Try Again</button>
            </div>

            <div id="victory-screen" class="screen hidden">
                <h1>SURVIVED</h1>
                <p>The darkness recedes... for now.</p>
                <button id="home-btn">Return</button>
            </div>
            
            <div id="hud" class="hidden">
                <div id="hp-display">Integrity: <span id="hp-value">3</span></div>
                <div id="time-display">Sync: <span id="time-value">0:00</span></div>
            </div>
        </div>
    </div>

    <script src="game (1).js"></script>
</body>
</html>
