<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Evasion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- The main stage for the bullet hell -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        
        <!-- UI Overlays -->
        <div id="ui-layer">
            <!-- Main Menu -->
            <div id="start-screen" class="screen">
                <h1>VOID EVASION</h1>
                <p id="subtitle">The man who speaks in hands awaits...</p>
                <div class="controls-info">Move: WASD / Arrows | Dash: Space</div>
                <button id="start-btn">Enter The Void</button>
            </div>

            <!-- Death Screen -->
            <div id="game-over-screen" class="screen hidden">
                <h1>SHATTERED</h1>
                <p>Your determination wasn't enough.</p>
                <button id="restart-btn">Try Again</button>
            </div>

            <!-- Victory Screen -->
            <div id="victory-screen" class="screen hidden">
                <h1>SURVIVED</h1>
                <p>The darkness recedes... for now.</p>
                <button id="home-btn">Return</button>
            </div>
            
            <!-- Heads Up Display -->
            <div id="hud" class="hidden">
                <div id="hp-display">Integrity: <span id="hp-value">3</span></div>
                <div id="time-display">Sync: <span id="time-value">0:00</span></div>
            </div>
        </div>
    </div>

    <!-- Links to the logic we will build later -->
    <script src="game.js"></script>
</body>
</html>
