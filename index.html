<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Evasion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .screen {
            position: absolute;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }
        .active { display: flex; }
        h1 {
            font-size: 4rem;
            margin-bottom: 2rem;
            color: #00FF00;
            text-shadow: 0 0 15px #00FF00;
        }
        h2 { font-size: 2.5rem; margin-bottom: 1.5rem; }
        button {
            background: transparent;
            border: 2px solid #00FF00;
            color: #00FF00;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
            text-transform: uppercase;
        }
        button:hover {
            background: #00FF00;
            color: black;
            box-shadow: 0 0 15px #00FF00;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .color-btn {
            width: 60px;
            height: 60px;
            cursor: pointer;
            border: 2px solid #333;
            transition: 0.2s;
        }
        .color-btn:hover { border-color: white; transform: scale(1.1); }
        p { font-size: 1.5rem; line-height: 2rem; }
        canvas {
            display: none;
            background-color: black;
            z-index: 1;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.5rem;
            z-index: 5;
            display: none;
        }
        .danger-text {
            color: red;
            text-shadow: 0 0 15px red;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Main Menu -->
    <div id="menu-screen" class="screen active">
        <h1>NEON EVASION</h1>
        <button onclick="startGame()">Start</button>
        <button onclick="showScreen('customize-screen')">Customize</button>
        <button onclick="showScreen('keybinds-screen')">Keybinds</button>
        <button onclick="showScreen('credits-screen')">Credits</button>
    </div>

    <!-- Customize Screen -->
    <div id="customize-screen" class="screen">
        <h2>SELECT PLAYER COLOR</h2>
        <div class="color-grid">
            <div class="color-btn" style="background: #00FF00;" onclick="setPlayerColor('#00FF00')"></div>
            <div class="color-btn" style="background: #FF00FF;" onclick="setPlayerColor('#FF00FF')"></div>
            <div class="color-btn" style="background: #FF0000;" onclick="setPlayerColor('#FF0000')"></div>
            <div class="color-btn" style="background: #FFA500;" onclick="setPlayerColor('#FFA500')"></div>
            <div class="color-btn" style="background: #FFFF00;" onclick="setPlayerColor('#FFFF00')"></div>
            <div class="color-btn" style="background: #0000FF;" onclick="setPlayerColor('#0000FF')"></div>
            <div class="color-btn" style="background: #800080;" onclick="setPlayerColor('#800080')"></div>
            <div class="color-btn" style="background: #FFFFFF;" onclick="setPlayerColor('#FFFFFF')"></div>
            <div class="color-btn" style="background: #000000; border: 1px solid #333;" onclick="setPlayerColor('#000000')"></div>
        </div>
        <p>Current Color: <span id="current-color-text" style="color: cyan;">Cyan</span></p>
        <button onclick="showScreen('menu-screen')">Back</button>
    </div>

    <!-- Keybinds Screen -->
    <div id="keybinds-screen" class="screen">
        <h2>HOW TO PLAY</h2>
        <p><strong>Arrow Keys / WASD</strong> - Movement</p>
        <p><strong>Spacebar</strong> - Teleport (Dash through attacks)</p>
        <br>
        <button onclick="showScreen('menu-screen')">Back</button>
    </div>

    <!-- Credits Screen -->
    <div id="credits-screen" class="screen">
        <h2>CREDITS</h2>
        <p>Made by: AI<br>and Jay Smith</p>
        <br>
        <button onclick="showScreen('menu-screen')">Back</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
        <h1 class="danger-text">SYSTEM FAILURE</h1>
        <p>Time Survived: <span id="survival-time">0</span>s</p>
        <button onclick="showScreen('menu-screen')">MAIN MENU</button>
    </div>

    <!-- Game Canvas -->
    <div id="hud">Time: <span id="timer-display">0</span></div>
    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Game State
    let animationId;
    let gameActive = false;
    let frameCount = 0;
    let projectiles = [];
    let playerColor = '#00FFFF';
    let startTime;
    
    // Input State
    const keys = {
        ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
        w: false, s: false, a: false, d: false, ' ': false
    };

    // Player Object
    const player = {
        x: 0, y: 0, size: 20, speed: 6,
        dashCooldown: 0, maxDashCooldown: 45, dashDistance: 180, isInvulnerable: 0
    };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        canvas.style.display = 'none';
        document.getElementById('hud').style.display = 'none';
    }

    function setPlayerColor(color) {
        playerColor = color;
        document.getElementById('current-color-text').textContent = color;
        document.getElementById('current-color-text').style.color = color === '#000000' ? '#555' : color;
    }

    // Controls
    window.addEventListener('keydown', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        
        // Teleport Mechanics
        if (e.key === ' ' && gameActive && player.dashCooldown <= 0) {
            let dx = 0; let dy = 0;
            if (keys.ArrowUp || keys.w) dy -= 1;
            if (keys.ArrowDown || keys.s) dy += 1;
            if (keys.ArrowLeft || keys.a) dx -= 1;
            if (keys.ArrowRight || keys.d) dx += 1;
            
            if (dx === 0 && dy === 0) dx = 1; // Default dash right

            let length = Math.sqrt(dx*dx + dy*dy);
            player.x += (dx / length) * player.dashDistance;
            player.y += (dy / length) * player.dashDistance;
            
            player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
            player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
            
            player.dashCooldown = player.maxDashCooldown;
            player.isInvulnerable = Math.max(player.isInvulnerable, 15); // Brief invincibility during dash
        }
    });

    window.addEventListener('keyup', (e) => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });

    function spawnProjectile(x, y, vx, vy, size) {
        projectiles.push({ x, y, vx, vy, size });
    }

    function executeAttacks() {
        let t = frameCount;

        // Give the player 2 full seconds (120 frames) before ANY attacks spawn
        if (t < 120) return;

        // Phase 1: Warmup corners (Starts at 2 seconds)
        if (t > 120 && t < 400 && t % 25 === 0) {
            let speed = 4;
            spawnProjectile(0, 0, speed, speed, 15);
            spawnProjectile(canvas.width, 0, -speed, speed, 15);
            spawnProjectile(0, canvas.height, speed, -speed, 15);
            spawnProjectile(canvas.width, canvas.height, -speed, -speed, 15);
        }

        // Phase 2: The Spiral (Starts at ~6.5 seconds)
        if (t > 400 && t < 1000 && t % 5 === 0) {
            let angle = t * 0.1;
            let cx = canvas.width / 2;
            let cy = canvas.height / 2;
            spawnProjectile(cx, cy, Math.cos(angle)*6, Math.sin(angle)*6, 12);
            spawnProjectile(cx, cy, Math.cos(angle + Math.PI)*6, Math.sin(angle + Math.PI)*6, 12);
        }

        // Phase 3: Sweeping Walls (Horizontal & Vertical - Starts at ~10 seconds)
        if (t > 600 && t % 150 === 0) {
            let gapY = Math.random() * (canvas.height - 200) + 100;
            for(let i=0; i<canvas.height; i+=40) {
                if(Math.abs(i - gapY) > 90) spawnProjectile(canvas.width + 50, i, -8, 0, 20);
            }
        }
        if (t > 800 && t % 180 === 0) {
            let gapX = Math.random() * (canvas.width - 200) + 100;
            for(let i=0; i<canvas.width; i+=40) {
                if(Math.abs(i - gapX) > 90) spawnProjectile(i, -50, 0, 8, 20);
            }
        }

        // Phase 4: Targeted Bursts (Starts at ~16 seconds)
        if (t > 1000 && t % 90 === 0) {
            let angle = Math.atan2(player.y - canvas.height/2, player.x - canvas.width/2);
            for(let i = -2; i <= 2; i++) {
                spawnProjectile(canvas.width/2, canvas.height/2, Math.cos(angle + i*0.2)*10, Math.sin(angle + i*0.2)*10, 18);
            }
        }

        // Phase 5: Chaos Rain (Starts at ~20 seconds)
        if (t > 1200 && t % 10 === 0) {
            spawnProjectile(Math.random() * canvas.width, -30, (Math.random()-0.5)*2, 5 + Math.random()*5, Math.random()*15 + 10);
        }
    }

    function update() {
        if (!gameActive) return;

        let dx = 0; let dy = 0;
        if (keys.ArrowUp || keys.w) dy -= 1;
        if (keys.ArrowDown || keys.s) dy += 1;
        if (keys.ArrowLeft || keys.a) dx -= 1;
        if (keys.ArrowRight || keys.d) dx += 1;

        if (dx !== 0 && dy !== 0) {
            let length = Math.sqrt(dx*dx + dy*dy);
            dx /= length; dy /= length;
        }

        player.x += dx * player.speed;
        player.y += dy * player.speed;

        player.x = Math.max(player.size/2, Math.min(canvas.width - player.size/2, player.x));
        player.y = Math.max(player.size/2, Math.min(canvas.height - player.size/2, player.y));

        if (player.dashCooldown > 0) player.dashCooldown--;
        if (player.isInvulnerable > 0) player.isInvulnerable--;

        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;

            // Remove projectiles that go way off screen
            if (p.x < -100 || p.x > canvas.width + 100 || p.y < -100 || p.y > canvas.height + 100) {
                projectiles.splice(i, 1);
                continue;
            }

            // Collision Detection (Only trigger if player is NOT invulnerable)
            if (player.isInvulnerable <= 0) {
                if (Math.abs(player.x - p.x) < (player.size/2 + p.size/2 - 2) && 
                    Math.abs(player.y - p.y) < (player.size/2 + p.size/2 - 2)) {
                    gameOver();
                }
            }
        }

        executeAttacks();
        frameCount++;
        
        document.getElementById('timer-display').innerText = Math.floor((Date.now() - startTime) / 1000);
        
        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        // Motion blur background
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Player Rendering
        ctx.globalAlpha = player.isInvulnerable > 0 ? 0.4 : 1.0; // Transparent when invincible
        ctx.fillStyle = playerColor;
        ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);
        ctx.globalAlpha = 1.0;
        
        // Cooldown Ring
        if (player.dashCooldown > 0) {
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size + 5, -Math.PI/2, (-Math.PI/2) + (Math.PI * 2 * (1 - player.dashCooldown/player.maxDashCooldown)));
            ctx.stroke();
        }

        // Projectiles Rendering
        ctx.fillStyle = '#00FF00';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00FF00';
        for (let p of projectiles) {
            ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
        }
        ctx.shadowBlur = 0; 
        
        // Draw "READY" text during startup invulnerability
        if (player.isInvulnerable > 0 && frameCount < 120) {
            ctx.fillStyle = `rgba(255, 255, 255, ${player.isInvulnerable / 120})`;
            ctx.font = '3rem Courier New';
            ctx.textAlign = 'center';
            ctx.fillText('GET READY!', canvas.width / 2, player.y - 50);
        }
    }

    function startGame() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        
        // Ensure canvas knows its real size before spawning
        resize();
        canvas.style.display = 'block';
        document.getElementById('hud').style.display = 'block';
        
        // Spawn exactly in the middle of the screen
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        
        projectiles = [];
        frameCount = 0;
        gameActive = true;
        startTime = Date.now();
        
        // Give 2 seconds (120 frames at 60fps) of invincibility at the very start
        player.isInvulnerable = 120; 
        
        update();
    }

    function gameOver() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        let timeSurvived = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('survival-time').innerText = timeSurvived;
        showScreen('game-over-screen');
    }
</script>

</body>
</html>
